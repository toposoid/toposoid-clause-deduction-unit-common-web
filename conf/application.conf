# https://www.playframework.com/documentation/latest/Configuration
deployment = ${?DEPLOYMENT}
play.http.secret.key = """iWyJJryqCqMIau59yaTmZCeCO6BkSewEylsBq3CR0Hc="""

play.filters.hosts {
  allowed = ["127.0.0.1:9201", "localhost:9201", ${?PRIVATE_IP_ADDRESS}":"${?PLAY_HTTP_PORT}]
}

play.filters.cors {
  pathPrefixes = ["/changeEndPoints", "/getEndPoints"]
  allowedHttpMethods = ["GET", "POST", "HEAD", "PUT", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type"]
  preflightMaxAge = 3 days
}
play.filters.enabled += "play.filters.csrf.CSRFFilter"
local{
    TOPOSOID_GRAPHDB_WEB_HOST = ${?TOPOSOID_GRAPHDB_WEB_HOST}
    TOPOSOID_GRAPHDB_WEB_PORT = ${?TOPOSOID_GRAPHDB_WEB_PORT}
    TOPOSOID_IN_MEMORY_DB_WEB_HOST = ${?TOPOSOID_IN_MEMORY_DB_WEB_HOST}
    TOPOSOID_IN_MEMORY_DB_WEB_PORT = ${?TOPOSOID_IN_MEMORY_DB_WEB_PORT}
    TOPOSOID_CLAUSE_DEDUCTION_UNITS = ${?TOPOSOID_CLAUSE_DEDUCTION_UNITS}
    TOPOSOID_CLAUSE_DEDUCTION_PORTS = ${?TOPOSOID_CLAUSE_DEDUCTION_PORTS}
    TOPOSOID_CLAUSE_DEDUCTION_NAMES = ${?TOPOSOID_CLAUSE_DEDUCTION_NAMES}
    TOPOSOID_ONLY_CLAUSE_DEDUCTION_FORCE = ${?TOPOSOID_ONLY_CLAUSE_DEDUCTION_FORCE}

}